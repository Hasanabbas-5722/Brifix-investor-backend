[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "brifix-investor-backend"
version = "0.1.0"
description = "Brifix Investor Backend API for Vercel Deployment"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    # ── Core API framework ───────────────────────────────────────
    "flask>=3.0.0",
    "flask-cors>=4.0.0",
    "flask-pymongo>=3.0.0",
    "flask-socketio>=5.3.6",
    "python-socketio>=5.11.0",
    "python-engineio>=4.9.0",
    "eventlet>=0.35.0",

    # ── Database ─────────────────────────────────────────────────
    "pymongo>=4.6.0",

    # ── Auth & Security ──────────────────────────────────────────
    "bcrypt>=4.1.2",
    "PyJWT>=2.8.0",
    "pyotp>=2.9.0",
    "pywebpush>=2.0.0",
    "py-vapid>=1.9.0",
    "python-dotenv>=1.0.0",

    # ── Market data ──────────────────────────────────────────────
    "yfinance>=0.2.36",
    "yahoo-fin>=0.8.9.1",
    "newsapi-python>=0.2.7",
    "smartapi-python>=1.4.7",
    "growwapi>=1.5.0",
    "nse>=1.0.7",

    # ── Data & ML (lightweight subset only) ─────────────────────
    # NOTE: xgboost (~350 MB), statsmodels (~80 MB) and tensorflow (~300 MB)
    # are intentionally excluded to keep Vercel bundle under 500 MB.
    # The prediction service has try/except fallbacks that automatically
    # switch to RandomForest (scikit-learn) when these are unavailable.
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "scikit-learn>=1.3.0",
    "ta>=0.11.0",

    # ── Utilities ────────────────────────────────────────────────
    "requests>=2.31.0",
    "pydantic>=2.0.0",
    "rich>=13.7.0",
    "logzero>=1.7.0",
    "websocket-client>=1.7.0",
]